<style>
:root{--bg:#f3efff;--card:#fff;--ink:#16112b;--mute:#5f5880;--pri:#7c5cff;--pop:#c6ff3d;--popink:#16112b;--pink:#ff4d8d;--warn:#d6336c;--shc:#16112b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#100b1f;--card:#1c1534;--ink:#f6f3ff;--mute:#a79fc7;--pri:#9a7dff;--pink:#ff6aa2;--warn:#ff8fab;--shc:#7c5cff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;line-height:1.45;background:radial-gradient(circle at 0 0,rgba(255,77,141,.28),transparent 42%),radial-gradient(circle at 100% 15%,rgba(124,92,255,.32),transparent 46%),var(--bg)}
main{max-width:520px;margin:0 auto;padding:12px 16px 150px}
.logo{font-size:30px;font-weight:800;letter-spacing:-1px;margin:6px 0 10px}
.logo span{background:var(--pink);color:#fff;padding:0 10px;border-radius:12px;display:inline-block;transform:rotate(-3deg);margin-left:2px}
.mq{overflow:hidden;border:2.5px solid var(--ink);border-radius:999px;background:var(--pop);color:var(--popink);font-weight:700;font-size:13px;margin-bottom:14px;white-space:nowrap}
.mq div{display:inline-block;padding:5px 0;animation:mq 18s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.st{font:inherit;font-weight:800;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);padding:6px 0;line-height:1.2;cursor:pointer}
.st small{display:block;font-weight:500;font-size:12px}
.st.cur{background:var(--pri);color:#fff;box-shadow:3px 3px 0 var(--shc)}
.st.done{background:var(--pop);color:var(--popink)}
.st:disabled{opacity:.45;cursor:default}
.big{font-size:clamp(46px,15vw,68px);line-height:1.3;font-weight:800;margin:6px 0 18px;letter-spacing:-1px}
.big em{font-style:normal;background:var(--pink);color:#fff;padding:0 12px;border-radius:16px;display:inline-block;transform:rotate(-3deg)}
.ttl{font-size:32px;font-weight:800;line-height:1.3;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
.stk{display:inline-block;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;transform:rotate(-2deg);margin-bottom:6px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--shc);padding:16px;margin-bottom:16px}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:12px 18px;box-shadow:3px 3px 0 var(--shc);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shc)}
.btn.pri{background:var(--pop);color:var(--popink)}
.btn.xl{font-size:22px;padding:18px 26px;width:100%;margin-bottom:12px}
.btn.ghost{box-shadow:none;background:transparent;width:100%}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5}
input{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;width:100%;min-width:0}
input:focus{outline:3px solid var(--pri);outline-offset:1px}
label{font-size:12px;color:var(--mute);font-weight:500;display:block}
.rw{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.bill-row{border-top:2px dashed var(--mute);padding:12px 0}
.bill-row:first-of-type{border-top:0;padding-top:0}
.fee{display:flex;gap:10px;margin-top:6px}
.fee>div{flex:1}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--pop);color:var(--popink);border:2.5px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:800;margin-bottom:14px}
.warn{color:var(--warn);font-weight:700;font-size:14px;margin-bottom:8px}
.mute{color:var(--mute);font-size:14px}
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.pc{border:2.5px solid var(--ink);border-radius:18px;background:var(--c);color:#16112b;text-align:center;padding:10px 4px;font-weight:700;position:relative;box-shadow:3px 3px 0 var(--shc)}
.pc .e{font-size:34px;line-height:1.2}
.pc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.pc button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:12px;cursor:pointer;padding:0}
.ic{border:2.5px solid var(--ink);border-radius:20px;background:var(--card);padding:14px;margin-bottom:14px;box-shadow:4px 4px 0 var(--shc)}
.ic.un{border-style:dashed}
.ic .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:800;font-size:17px}
.ic .h span{color:var(--pri);white-space:nowrap}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.av{font:inherit;position:relative;width:62px;border:2.5px solid var(--ink);border-radius:16px;background:var(--card);color:var(--ink);padding:6px 2px;cursor:pointer;transition:transform .1s}
.av .e{font-size:24px;display:block;line-height:1.2}
.av small{display:block;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.on{background:var(--c);color:#16112b;transform:translateY(-3px);box-shadow:3px 3px 0 var(--shc)}
.av.on::after{content:"✓";position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;line-height:20px;font-weight:800}
.av.all{width:auto;padding:6px 12px;font-weight:800;font-size:14px;align-self:center}
.rc{border:2.5px solid var(--ink);border-radius:24px;background:var(--card);box-shadow:5px 5px 0 var(--shc);padding:16px;margin-bottom:18px;position:relative;overflow:hidden}
.rc::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:var(--c)}
.rh{display:flex;gap:12px;align-items:center;margin-top:6px}
.bub{width:54px;height:54px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);display:grid;place-items:center;font-size:28px;flex:none}
.rh b{font-size:20px}
.bdg{margin-left:auto;background:var(--pink);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.amt{font-size:52px;font-weight:800;line-height:1.3;letter-spacing:-1px;background:linear-gradient(90deg,var(--pri),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.amt small{font-size:24px;margin-left:4px}
.qr{background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px;display:inline-block;transform:rotate(-2deg)}
.qr svg{display:block;width:190px;height:190px}
.tt{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:12px 4px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2.5px solid var(--ink);z-index:20}
.nav .btn{flex:1;max-width:300px}.nav .btn.sm{flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;width:max-content;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--pink);color:#fff}
#busy{position:fixed;inset:0;background:rgba(16,11,31,.85);color:#fff;display:grid;place-content:center;text-align:center;z-index:40;font-weight:700;font-size:18px}
#busy[hidden]{display:none}
.spin{font-size:64px;animation:sp 1s ease-in-out infinite}
@keyframes sp{50%{transform:rotate(18deg) scale(1.2)}}
.cf{position:fixed;top:-30px;z-index:50;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mq div,.spin{animation:none}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#cam{position:fixed;inset:0;background:#000;z-index:60;overflow:hidden}
#cam[hidden]{display:none}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;top:14%;bottom:26%;left:7%;right:7%;border:3px dashed var(--pop);border-radius:20px;pointer-events:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
#ct{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);margin:0;color:#fff;font-weight:700;background:rgba(0,0,0,.55);padding:4px 14px;border-radius:999px;white-space:nowrap;font-size:14px}
.cbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:7px solid var(--pop);cursor:pointer;padding:0}
.shutter:active{transform:scale(.92)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a0f;--card:#15131c;--ink:#f7f1e3;--mute:#a89f8a;--pri:#d4af37;--pink:#e8b4b8;--warn:#ff9b8a;--shc:rgba(212,175,55,.3);--gold:#d4af37;--bd:rgba(212,175,55,.45);--navbg:rgba(11,10,15,.82);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0a0f;--card:#15131c;--ink:#f7f1e3;--mute:#a89f8a;--pri:#d4af37;--pink:#e8b4b8;--warn:#ff9b8a;--shc:rgba(212,175,55,.3);--gold:#d4af37;--bd:rgba(212,175,55,.45);--navbg:rgba(11,10,15,.82);color-scheme:dark}
body{background:radial-gradient(ellipse at 50% -8%,rgba(212,175,55,.24),transparent 55%),radial-gradient(circle at 100% 92%,rgba(183,110,121,.18),transparent 45%),var(--bg)}
.logo,.big,.ttl,.amt{font-family:"Playfair Display","Noto Serif Thai",serif}
.logo span{background:linear-gradient(90deg,#fff1b8,#d4af37,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0;transform:none;font-style:italic;border-radius:0}
.mq{background:transparent;color:var(--pri);border:1px solid var(--bd);letter-spacing:.2em;font-size:11px;font-weight:500}

.btn{box-shadow:0 6px 18px -8px rgba(0,0,0,.5);border-radius:14px}
.btn:active{transform:scale(.97);box-shadow:none}
.btn.pri{color:var(--popink);border-color:#f3d77a;box-shadow:0 8px 24px -8px rgba(212,175,55,.75)}
.btn.ghost{box-shadow:none}
.st.cur{background:linear-gradient(135deg,#fff1b8,#d4af37);color:#1a1405;box-shadow:0 6px 16px -6px rgba(212,175,55,.7)}
.big em{background:linear-gradient(135deg,#fff1b8,#d4af37);color:#1a1405;font-style:italic}
.frame{border-color:var(--gold)}.shutter{border-color:var(--gold)}
.rc::before{height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.bdg,.toast.bad{background:linear-gradient(135deg,#fff1b8,#d4af37);color:#1a1405}
.pc{border-radius:16px;box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.av.on{box-shadow:0 8px 18px -8px var(--c)}
.nav{background:var(--navbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
.qr{border:1px solid var(--bd);transform:none;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
[data-tilt]{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .18s ease-out}
.rc::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.22),transparent 55%);opacity:0;transition:opacity .2s;pointer-events:none}
.rc.on::after{opacity:1}
.mas{display:block;overflow:visible;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.mas .eh{display:none}.mas.happy .eo{display:none}.mas.happy .eh{display:inline}
.mas .eo{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mas .wv{transform-box:fill-box;transform-origin:30% 80%;animation:wv 2s ease-in-out infinite}
@keyframes wv{50%{transform:rotate(-14deg)}}
.tip{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tip .mas{width:64px;flex:none}
.tb,.tb2{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 12px;font-size:14px;font-weight:500}
.tip .tb::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--card);border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);transform:translateY(-50%) rotate(45deg)}
.scene{position:relative;height:200px;margin-bottom:6px;display:flex;justify-content:center;align-items:flex-end}

.fl{position:absolute;transform-style:preserve-3d;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
.coin{position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:spin 6s linear infinite}
.coin i,.coin b{position:absolute;inset:0;border-radius:50%}
.coin i{background:#a8780f;transform:translateZ(var(--z))}
.coin b{display:grid;place-items:center;font-weight:800;font-size:calc(var(--s)*.5);color:#7a5a00;background:radial-gradient(circle at 30% 30%,#fff7cc,#e6b93a 60%,#b8860b);border:2px solid #f3d77a;transform:translateZ(5px);backface-visibility:hidden}
.coin b.bk{transform:rotateY(180deg) translateZ(5px)}
@keyframes spin{to{transform:rotateY(360deg)}}

function setFeedbackType(type){
  const name=$('#fbName')?.value||'',message=$('#fbMessage')?.value||'';feedbackType=type;renderFeedback();

async function shareFeedback(){
  const note=feedbackNotes()[0];if(!note)return;const text=feedbackText(note);
  try{if(navigator.share){await navigator.share({title:'Billbuddy feedback',text});return}await navigator.clipboard.writeText(text);toast(t('คัดลอกข้อความให้แล้ว ✨'))}catch(e){}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('feedback-open'))closeFeedback()});
let stream,camBad;
async function scan(){
  if(camBad||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#file').click();return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
    $('#vid').srcObject=stream;$('#cam').hidden=false;
  }catch(e){camBad=1;toast(t('เปิดกล้องในหน้านี้ไม่ได้ ใช้กล้องของเครื่องแทน'),1);$('#file').click()}
}
function camClose(){if(stream)stream.getTracks().forEach(k=>k.stop());stream=null;$('#cam').hidden=true}
function snap(){
  const v=$('#vid');if(!v.videoWidth)return;
  const c=document.createElement('canvas'),z=Math.min(1,1400/Math.max(v.videoWidth,v.videoHeight));
  c.width=Math.round(v.videoWidth*z);c.height=Math.round(v.videoHeight*z);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  c.toBlob(b=>{camClose();readBill(b)},'image/jpeg',.85);
}

/* ---------- PromptPay (ไม่พึ่ง AI) ---------- */
function tlv(t,v){return t+String(v.length).padStart(2,'0')+v}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppValid(id){const d=id.replace(/\D/g,'');return d.length===10||d.length===13||d.length===15}
function ppPayload(id,amt){
  id=id.replace(/\D/g,'');
  const acc=id.length===13?tlv('02',id):id.length===15?tlv('03',id):tlv('01','0066'+id.slice(1));
  let p=tlv('00','01')+tlv('01','12')+tlv('29',tlv('00','A000000677010111')+acc)+tlv('53','764')+tlv('54',amt.toFixed(2))+tlv('58','TH')+'6304';
  return p+crc16(p);
}
function qrSvg(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}

/* ---------- คำนวณ ---------- */
function calc(){
  const sub=S.people.map(()=>0);let unassigned=0;
  S.items.forEach(it=>{
    const t=(+it.price||0)*(+it.qty||1);
    if(!it.who.length){if(t>0)unassigned++;return}
    it.who.forEach(i=>sub[i]+=t/it.who.length);
  });
  const k=(1+S.svc/100)*(1+S.vat/100);
  return{sub,tot:sub.map(s=>Math.round(s*k*100)/100),unassigned,bill:S.items.reduce((a,it)=>a+(+it.price||0)*(+it.qty||1),0)*k};
}
const fmt=n=>n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});

function delItem(id){S.items=S.items.filter(i=>i.id!==id);render()}
function upd(id,f,v){const it=S.items.find(i=>i.id===id);it[f]=f==='name'?v:(+v||0);render()}
function addPerson(){const el=$('#pn'),v=el.value.trim();if(!v)return;const a=AV[S.people.length%AV.length];S.people.push({n:v,e:a[0],c:a[1]});render();$('#pn').focus()}
function delPerson(i){S.people.splice(i,1);S.items.forEach(it=>{it.who=it.who.filter(w=>w!==i).map(w=>w>i?w-1:w)});render()}
function tog(id,i){S.w=0;const it=S.items.find(x=>x.id===id);it.who=it.who.includes(i)?it.who.filter(w=>w!==i):[...it.who,i];render()}
function all(id){S.w=0;const it=S.items.find(x=>x.id===id);it.who=it.who.length===S.people.length?[]:S.people.map((_,i)=>i);render()}
function setPP(v){S.pp=v;try{localStorage.setItem('pp',v)}catch(e){}$('#qrs').innerHTML=tr(qrs())}
function go(n){S.step=n;render();scrollTo(0,0);if(n===3)fire()}
function next(){
  if(S.step===3){if(confirm(t('เริ่มบิลใหม่?'))){S.items=[];S.people=[];go(0)}return}
  if(S.step===0&&!S.items.length)return toast(t('ใส่รายการอย่างน้อย 1 อย่างก่อนนะ'),1);
  if(S.step===1&&!S.people.length)return toast(t('เพิ่มเพื่อนอย่างน้อย 1 คนนะ'),1);
  if(S.step===2){const u=calc().unassigned;if(u&&!S.w){S.w=1;return toast(t('ยังมี {0} รายการที่ไม่มีคนกิน กดอีกครั้งเพื่อข้าม',u),1)}S.w=0}
  go(S.step+1);
}

function qrs(){
  const c=calc(),ok=ppValid(S.pp);
  const act=S.people.map((p,i)=>i).filter(i=>c.tot[i]>0);
  let hi=-1,lo=-1;
  if(act.length>1){hi=act.reduce((a,b)=>c.tot[b]>c.tot[a]?b:a);lo=act.reduce((a,b)=>c.tot[b]<c.tot[a]?b:a);if(c.tot[hi]===c.tot[lo])hi=lo=-1}
  return (c.unassigned?`<div class="warn">${t('⚠️ มี {0} รายการที่ไม่มีคนกิน (ไม่ถูกนับในยอดใคร)',c.unassigned)}</div>`:'')
   +act.map(i=>{const p=S.people[i];return `<div class="rc" data-tilt style="--c:${p.c}"><div class="rh"><div class="bub">${p.e}</div><div><b>${esc(p.n)}</b><div class="mute">${t('ก่อนบริการ/VAT {0} ฿',fmt(c.sub[i]))}</div></div>${i===hi?'<span class="bdg">⟦👑 สายเปย์⟧</span>':i===lo?'<span class="bdg">⟦🌱 สายประหยัด⟧</span>':''}</div>
    <div class="amt">${fmt(c.tot[i])}<small>฿</small></div>
    ${ok?`<div class="qr">${qrSvg(ppPayload(S.pp,c.tot[i]))}</div>`:'<div class="warn">⟦ใส่ PromptPay ด้านบนเพื่อให้ QR ขึ้น ☝️⟧</div>'}
    <div style="margin-top:12px"><button class="btn sm" onclick="line(${i})">⟦💬 ส่งยอดทาง LINE⟧</button></div></div>`}).join('')
   +`<div class="tt"><span>⟦รวมบิล⟧</span><span>${fmt(c.bill)} ฿</span></div><button class="btn xl" onclick="copyAll()">⟦📋 คัดลอกสรุปทั้งโต๊ะ⟧</button>`;
}

async function shrink(file){
  const bmp=await createImageBitmap(file),sc=Math.min(1,1400/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
}

    S.items=(j.items||[]).map(r=>({id:S.id++,name:String(r.name||''),price:+r.price||0,qty:+r.qty||1,who:[]}));
    S.svc=+j.service_pct||0;S.vat=+j.vat_pct||0;
    S.step=0;render();toast(t('อ่านได้ {0} รายการ ตรวจก่อนไปต่อนะ ✅',S.items.length));
  }catch(e){toast(t('อ่านบิลไม่สำเร็จ ลองถ่ายให้ชัดขึ้น หรือพิมพ์รายการเอง'),1)}
  finally{$('#busy').hidden=true;$('#file').value='';$('#gal').value=''}
}
render();
</script>
</body>
</html>
